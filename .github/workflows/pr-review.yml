# AI-powered PR review using Claude Code.

name: PR Review

on:
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  review:
    uses: wflowcom/ai-gh-actions/.github/workflows/pr-review.yml@pr-review/v1
    with:
      skip-meldoc-review: ${{ startsWith(github.head_ref, 'renovate/') }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

[project]
name = "wflow-cli"
version = "0.1.0"
description = "Command-line client for the wflow.com public API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "wflow.com" }]
keywords = ["wflow", "cli", "api", "documents", "approval"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = ["wflow-api==0.1.0", "typer~=0.27.3"]

[project.urls]
Homepage = "https://www.wflow.com"
Documentation = "https://developers.wflow.com"

[project.scripts]
wflow = "wflow_cli.main:app"

[tool.uv.sources]
wflow-api = { workspace = true }

[build-system]
requires = ["uv_build>=0.10,<0.20"]
build-backend = "uv_build"

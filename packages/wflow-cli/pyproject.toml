[project]
name = "wflow-cli"
version = "0.1.0"
description = "Command-line client for the wflow.com public API"
requires-python = ">=3.12"
dependencies = ["wflow-api==0.1.0", "typer~=0.27.3"]

[project.scripts]
wflow = "wflow_cli.main:app"

[tool.uv.sources]
wflow-api = { workspace = true }

[build-system]
requires = ["uv_build>=0.10,<0.20"]
build-backend = "uv_build"
